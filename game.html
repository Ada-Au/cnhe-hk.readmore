<head>
  <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <link rel="stylesheet" href="style.css" />
</head>
<div id="bg" style="display: flex">
  <!-- jpeg cannot be transparent -->
  <img
    class="logo"
    src="./assets/logo1.png"
    style="right: 4cqmin; max-width: 20%"
  />
  <img
    class="logo"
    src="./assets/logo2.png"
    style="left: 4cqmin; max-width: 50%"
  />
  <div id="game" style="height: 100%; width: 100%; container-type: size"></div>
  <button id="backBtn" onclick="setGame('select')">返回</button>
</div>

<script>
  const bgStyle = document.getElementById("bg").style;
  const game = document.getElementById("game");
  const logos = document.getElementsByClassName("logo");
  const backBtn = document.getElementById("backBtn");
  backBtn.style.display = "none";

  let gameData = {};

  params = new URLSearchParams(parent.window.location.search);

  function setLogo(state = true) {
    for (i = 0; i < logos.length; i++) {
      logos[i].style.display = state ? "block" : "none";
    }
  }

  var gTopic = "0";
  var currentGameData = {};
  var startTime = 0;
  var totalGameCount = 0;

  function setGame(path = "") {
    if (localStorage.getItem("interval")) {
      clearInterval(localStorage.getItem("interval"));
      localStorage.removeItem("interval");
    }

    bgStyle.backgroundImage = "url('./assets/bg.jpg')";

    gamePath = path;
    gName = gamePath.split("-")[0];
    gMode = gamePath.split("-")[1];
    gTopic = gamePath.split("-")[2];

    backBtn.style.display = "none";
    bgStyle.filter = "hue-rotate(0deg)";
    setLogo(true);

    if (
      gameData[gMode] === undefined ||
      gameData[gMode][gTopic] === undefined ||
      gameData[gMode][gTopic][gName] === undefined
    ) {
      gamePath = "select";
      $("#game").load("./select.html");
      return;
    }

    currentGameData = gameData[gMode][gTopic][gName];

    if (gamePath !== "pdf") {
      backBtn.style.display = "block";
      bgStyle.filter =
        "hue-rotate(" +
        Math.round((gameData[gMode][gTopic].color / 9) * 360) +
        "deg)";
    }

    $("#game").load("./" + gName + ".html");

    setLogo(false);
  }

  async function init() {
    await $.getJSON("gameData.json", function (json) {
      gameData = json;
    });

    totalGameCount = Object.keys(gameData).reduce((total, mode) => {
      return total + Object.keys(gameData[mode]).length;
    }, 0);

    console.log("Total game count:", totalGameCount);

    setGame();
  }
  init();
</script>
