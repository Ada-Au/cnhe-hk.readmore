<body>
  <div
    style="
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: scroll;
      position: relative;
    "
  >
    <img
      id="loading"
      src="./assets/loading.svg"
      alt="Loading"
      style="filter: unset; display: block"
    />
    <a
      id="gameBtn"
      style="
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 2.5cqw;
        box-shadow: 6px 6px 12px rgba(0, 21, 255, 0.6),
          -6px -6px 12px rgba(255, 0, 0, 0.6);
        background: rgba(255, 255, 255, 0.8);
        z-index: 10;
        cursor: pointer;
        display: none;
        color: black;
        text-decoration: none;
      "
      href="#link"
    >
      小遊戲
    </a>
    <div id="pdf-img" style="display: none">
      <div
        id="link"
        style="
          width: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          display: none;
          position: relative;
        "
      >
        <div class="gameTitle">
          <h2>時代精神，變革為民</h2>
        </div>
        <div class="selectionContainer"></div>
      </div>
    </div>
  </div>
</body>
<script>
  currenPdf = gameData.pdf?.map((e) => e.param).indexOf(params.get("pdf"));
  if (currenPdf === -1) {
    currenPdf = 0;
  }
  name = gameData.pdf[currenPdf].name;

  loading = document.getElementById("loading");
  link = document.getElementById("link");
  firstPageBtn = document.getElementById("firstPageBtn");
  pdfImg = document.getElementById("pdf-img");

  pdf = null;

  async function init() {
    const pdfPath = "assets/ppt/" + name + ".pdf";
    const pdfjsLib = await import("./pdfjs-dist/build/pdf.mjs");
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "./pdfjs-dist/build/pdf.worker.mjs";

    pdfjsLib.getDocument(pdfPath).promise.then((doc) => {
      pdf = doc;

      pdf.getPage(1).then((page) => {
        addImage(1);
      });
    });

    link.children[0].innerHTML += name;
    gameData.pdf[currenPdf].to.forEach((href) => {
      btn = document.createElement("button");
      link.children[1].appendChild(btn);
      btn.className = "selectionBtn";
      switch (href) {
        case "puzzle":
          btn.innerHTML = "砌圖";
          break;
        case "rhymes":
          btn.innerHTML = "接字";
          break;
        case "pair":
          btn.innerHTML = "對對碰";
          break;
        case "ticTacToe":
          btn.innerHTML = "過三關";
          break;
        default:
          btn.innerHTML = "Error";
          break;
      }
      btn.onclick = () => {
        setGame(href);
      };
    });
  }

  function addImage(i) {
    pdf.getPage(i).then((page) => {
      let viewport = page.getViewport({ scale: 1 });
      var canvas = document.createElement("canvas");

      canvas.height = viewport.height;
      canvas.width = viewport.width;
      ctx = canvas.getContext("2d");

      let pPromise = page.render({
        canvasContext: ctx,
        viewport: viewport,
      });

      pPromise.promise
        .then(() => {
          var image = new Image();
          image.id = "pdf-page-" + i;
          image.src = canvas.toDataURL();
          image.style.width = "100%";

          if (i < pdf.numPages - 2)
            link.insertAdjacentElement("beforebegin", image);
          else pdfImg.appendChild(image);
          // pdfImg.appendChild(image);
        })
        .then(() => {
          if (i < pdf.numPages) {
            addImage(i + 1);
          } else {
            loading.style.display = "none";
            pdfImg.style.display = "block";

            link.style.aspectRatio =
              pdfImg.children[0].naturalWidth +
              "/" +
              pdfImg.children[0].naturalHeight;
            link.style.display = "flex";

            document.getElementById("gameBtn").style.display = "block";
          }
        });
    });
  }

  init();
</script>
