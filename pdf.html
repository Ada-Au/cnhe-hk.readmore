<body>
  <button
    id="firstPageBtn"
    class="selectionBtn"
    style="
      margin: 2cqh 0 0 2cqw;
      font-size: 2cqw;
      visibility: hidden;
      cursor: pointer;
    "
    onclick="changePage(0, true)"
  >
    小遊戲
  </button>
  <div class="pdfContainer" style="overflow: hidden">
    <button class="pageBtn" id="prevBtn" onclick="changePage(-1)"><</button>
    <div
      style="
        display: flex;
        position: relative;
        justify-content: center;
        align-items: center;
        flex: 1;
        max-height: 100%;
        height: 100%;
      "
    >
      <canvas
        id="pdf-viewer"
        style="max-width: 100%; max-height: 100%"
      ></canvas>
      <div
        id="link"
        style="
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          display: none;
          position: relative;
        "
      >
        <div class="gameTitle">
          <h2>時代精神，變革為民</h2>
        </div>
        <div class="selectionContainer"></div>
        <div
          style="
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 2.5cqw;
            pointer-events: none;
            box-shadow: 6px 6px 12px rgba(0, 21, 255, 0.6),
              -6px -6px 12px rgba(255, 0, 0, 0.6);
          "
        >
          小遊戲
        </div>
      </div>
    </div>
    <button class="pageBtn" id="nextBtn" onclick="changePage(1)">></button>
  </div>
</body>
<script>
  // params = new URLSearchParams(parent.window.location.search);
  currenPdf = gameData.pdf?.map((e) => e.param).indexOf(params.get("pdf"));
  if (currenPdf === -1) {
    currenPdf = 0;
  }
  name = gameData.pdf[currenPdf].name;

  nextBtn = document.getElementById("nextBtn");
  prevBtn = document.getElementById("prevBtn");
  canvas = document.getElementById("pdf-viewer");
  link = document.getElementById("link");
  firstPageBtn = document.getElementById("firstPageBtn");

  pdf = null;
  currentIndex = 1;
  prevBtn.className = "hideBtn";
  canvasScale = 1;

  async function init() {
    const pdfPath = "assets/ppt/" + name + ".pdf";
    const pdfjsLib = await import("./pdfjs-dist/build/pdf.mjs");
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "./pdfjs-dist/build/pdf.worker.mjs";

    pdfjsLib.getDocument(pdfPath).promise.then((doc) => {
      pdf = doc;
      resize();
      changePage(-1);
    });

    link.children[0].innerHTML += name;
    gameData.pdf[currenPdf].to.forEach((href) => {
      btn = document.createElement("button");
      link.children[1].appendChild(btn);
      btn.className = "selectionBtn";
      switch (href) {
        case "puzzle":
          btn.innerHTML = "砌圖";
          break;
        case "rhymes":
          btn.innerHTML = "接字";
          break;
        case "pair":
          btn.innerHTML = "對對碰";
          break;
        case "ticTacToe":
          btn.innerHTML = "過三關";
          break;
        default:
          btn.innerHTML = "Error";
          break;
      }
      btn.onclick = () => {
        setGame(href);
      };
    });
  }

  function resize() {
    pdf.getPage(currentIndex).then((page) => {
      let viewport = page.getViewport({ scale: canvasScale });
      let context = canvas.getContext("2d");
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      const canvasContainer = canvas.parentElement.parentElement;

      if (
        canvasContainer.clientWidth / viewport.width >
        canvasContainer.clientHeight / viewport.height
      ) {
        canvas.style.height = canvasContainer.clientHeight;
        canvas.style.width =
          (canvasContainer.clientHeight * viewport.width) / viewport.height;
        canvasScale = canvasContainer.clientHeight / viewport.height;
      } else {
        canvas.style.width = canvasContainer.clientWidth;
        canvas.style.height =
          (canvasContainer.clientWidth * viewport.height) / viewport.width;
        canvasScale = canvasContainer.clientWidth / viewport.width;
      }
    });
  }

  function changePage(offset, reset = false) {
    if (pdf === null) return;
    if (currentIndex + offset < 0 || currentIndex + offset > pdf.numPages)
      return;

    currentIndex += offset;
    if (reset) currentIndex = -1;

    prevBtn.className = currentIndex <= 0 ? "hideBtn" : "pageBtn";
    nextBtn.className = currentIndex >= pdf.numPages ? "hideBtn" : "pageBtn";
    firstPageBtn.style.visibility =
      currentIndex < pdf.numPages ? "hidden" : "visible";

    if (currentIndex + offset < 0) {
      link.style.display = "flex";
      canvas.style.display = "none";
    } else {
      canvas.style.display = "block";
      link.style.display = "none";

      pdf.getPage(currentIndex).then((page) => {
        let viewport = page.getViewport({ scale: 1 });

        let context = canvas.getContext("2d");

        page.render({
          canvasContext: context,
          viewport: viewport,
        });
      });
    }
  }

  canvas.addEventListener("touchstart", handleTouchStart, false);
  canvas.addEventListener("touchmove", handleTouchMove, false);
  link.addEventListener("touchstart", handleTouchStart, false);
  link.addEventListener("touchmove", handleTouchMove, false);

  init();

  function handleTouchStart(evt) {
    firstTouch = evt.touches[0];
    xDown = firstTouch.clientX;
  }

  function handleTouchMove(evt) {
    evt.preventDefault();
    if (!xDown) return;

    xUp = evt.touches[0].clientX;
    xDiff = xDown - xUp;

    if (xDiff > 0) {
      changePage(1);
    } else {
      changePage(-1);
    }

    xDown = null;
  }
</script>
