<body>
  <div
    style="
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: scroll;
      position: relative;
    "
  >
    <img
      id="loading"
      src="./assets/loading.svg"
      alt="Loading"
      style="filter: unset; display: block"
    />
    <a
      id="gameBtn"
      style="
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 2.5cqw;
        box-shadow: 6px 6px 12px rgba(0, 21, 255, 0.6),
          -6px -6px 12px rgba(255, 0, 0, 0.6);
        background: rgba(255, 255, 255, 0.8);
        z-index: 10;
        cursor: pointer;
        display: none;
        color: black;
        text-decoration: none;
      "
      href="#link"
    >
      小遊戲
    </a>
    <div id="pdf-img" style="display: none; position: relative; height: 100vh">
      <div
        id="page-shadow"
        style="z-index: 9999"
        class="pdf-page-img flip"
      ></div>
      <div
        id="link"
        style="
          width: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          display: none;
          position: relative;
        "
      >
        <div class="gameTitle">
          <h2>時代精神，變革為民</h2>
        </div>
        <div class="selectionContainer"></div>
      </div>
    </div>
  </div>
</body>
<script>
  currenPdf = gameData.pdf?.map((e) => e.param).indexOf(params.get("pdf"));
  if (currenPdf === -1) {
    currenPdf = 0;
  }
  name = gameData.pdf[currenPdf].name;

  loading = document.getElementById("loading");
  link = document.getElementById("link");
  firstPageBtn = document.getElementById("firstPageBtn");
  pdfImg = document.getElementById("pdf-img");

  pdf = null;
  let imageRatio = 1;
  let allowFlip = true;

  async function init() {
    const pdfPath = "assets/ppt/" + name + ".pdf";
    const pdfjsLib = await import("./pdfjs-dist/build/pdf.mjs");
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "./pdfjs-dist/build/pdf.worker.mjs";

    pdfjsLib.getDocument(pdfPath).promise.then((doc) => {
      pdf = doc;

      pdf.getPage(1).then((page) => {
        let viewport = page.getViewport({ scale: 2 });
        imageRatio = viewport.width / viewport.height;

        addImage(1);
      });
    });

    link.children[0].innerHTML += name;
    gameData.pdf[currenPdf].to.forEach((href) => {
      btn = document.createElement("button");
      link.children[1].appendChild(btn);
      btn.className = "selectionBtn";
      switch (href) {
        case "puzzle":
          btn.innerHTML = "砌圖";
          break;
        case "rhymes":
          btn.innerHTML = "接字";
          break;
        case "pair":
          btn.innerHTML = "對對碰";
          break;
        case "ticTacToe":
          btn.innerHTML = "過三關";
          break;
        default:
          btn.innerHTML = "Error";
          break;
      }
      btn.onclick = () => {
        setGame(href);
      };
    });
  }

  function addImage(i) {
    pdf.getPage(i).then((page) => {
      let viewport = page.getViewport({ scale: 2 });
      var canvas = document.createElement("canvas");

      canvas.height = viewport.height;
      canvas.width = viewport.height * imageRatio;
      ctx = canvas.getContext("2d");

      let pPromise = page.render({
        canvasContext: ctx,
        viewport: viewport,
      });

      pPromise.promise
        .then(() => {
          var div = document.createElement("div");
          div.className = "pdf-page-img";
          div.style.zIndex = pdf.numPages - i;
          div.id = "page-" + i;

          var image = new Image();
          image.id = "pdf-page-" + i;
          image.src = canvas.toDataURL();

          // image.className = "pdf-page-img";
          // image.style.zIndex = pdf.numPages - i;
          image.setAttribute("draggable", "false");
          image.height;

          image.onclick = () => {
            if (!allowFlip) return;
            allowFlip = false;
            div.classList.toggle("flip");

            if (div.classList.contains("flip")) {
              setTimeout(() => {
                div.style.zIndex = i;
                div.classList.add("invert");
              }, 500);
            } else {
              setTimeout(() => {
                div.style.zIndex = pdf.numPages - i;
                div.classList.remove("invert");
              }, 500);
            }

            setTimeout(() => {
              allowFlip = true;
            }, 800);
          };

          div.appendChild(image);

          if (i < pdf.numPages - 2)
            link.insertAdjacentElement("beforebegin", div);
          else pdfImg.appendChild(div);
        })
        .then(() => {
          if (i < pdf.numPages) {
            addImage(i + 1);
          } else {
            afterImageLoad();
          }
        });
    });
  }

  function afterImageLoad() {
    resize();
    loading.style.display = "none";
    pdfImg.style.display = "block";

    if (gameData.pdf[currenPdf].to.length === 0) return;
    link.style.aspectRatio =
      pdfImg.children[0].naturalWidth + "/" + pdfImg.children[0].naturalHeight;
    link.style.display = "flex";

    document.getElementById("gameBtn").style.display = "block";
  }

  function resize() {
    let shadow = document.getElementById("page-shadow");
    if (!pdfImg?.children[1]?.children[0]) return;
    console.log(
      window.innerWidth / window.innerHeight,
      pdfImg.children[1].children[0].naturalWidth /
        pdfImg.children[1].children[0].naturalHeight,

      window.innerWidth /
        window.innerHeight /
        (pdfImg.children[1].children[0].naturalWidth /
          pdfImg.children[1].children[0].naturalHeight)
    );

    let windowRatio = window.innerWidth / window.innerHeight;
    let pdfRatio =
      pdfImg.children[1].children[0].naturalWidth /
      pdfImg.children[1].children[0].naturalHeight;

    if (windowRatio < pdfRatio) {
      Array.from(pdfImg.children).forEach((image) => {
        if (!(image.children[0] instanceof HTMLImageElement)) return;
        image.children[0].style.width = "calc(100vw - 48px)";
        image.children[0].style.height = "auto";

        shadow.style.width = "calc(100vw - 48px)";
        shadow.style.height = "calc((100vw - 48px) / " + imageRatio + ")";
      });
    } else {
      Array.from(pdfImg.children).forEach((image) => {
        if (!(image.children[0] instanceof HTMLImageElement)) return;
        image.children[0].style.height = "100vh";
        image.children[0].style.width = "auto";

        shadow.style.height = "100vh";
        shadow.style.width = "calc(100vh * " + imageRatio + ")";
      });
    }

    if (windowRatio / pdfRatio >= 2) {
      Array.from(pdfImg.children).forEach((image) => {
        if (!(image.children[0] instanceof HTMLImageElement)) return;
        image.classList.add("centered");
      });
      shadow.classList.add("centered");
    } else {
      Array.from(pdfImg.children).forEach((image) => {
        if (!(image.children[0] instanceof HTMLImageElement)) return;
        image.classList.remove("centered");
      });
      shadow.classList.remove("centered");
    }
  }

  window.addEventListener("resize", resize);
  init();
</script>

<style scoped>
  .pdf-page-img {
    position: absolute;
    top: 50%;
    right: 0;
    margin-left: 48px;
    cursor: pointer;

    transform-origin: 0% 0%;
    -o-transform-origin: 0% 0%;
    -ms-transform-origin: 0% 0%;
    -moz-transform-origin: 0% 0%;
    -webkit-transform-origin: 0% 0%;

    transition-duration: 1s;
    transition-property: transform;
    transition-timing-function: ease-in-out;

    translate: 0% -50%;
  }

  .centered {
    top: 50%;
    left: 50%;
    margin-left: 0px;

    /* translate: -50% -50%; */
  }

  .flip {
    transform: rotateY(-180deg);
    -o-transform: rotateY(-180deg);
    -ms-transform: rotateY(-180deg);
    -moz-transform: rotateY(-180deg);
    -webkit-transform: rotateY(-180deg);
  }

  .invert > img {
    transform: scale(-1, 1);
  }

  .pdf-page-img::-moz-selection {
    background-color: transparent;
    color: #000;
  }

  .pdf-page-img::selection {
    background-color: transparent;
    color: #000;
  }

  .pdf-page-img > img::-moz-selection {
    background-color: transparent;
    color: #000;
  }

  .pdf-page-img > img::selection {
    background-color: transparent;
    color: #000;
  }

  #page-shadow {
    pointer-events: none;
  }
  #page-shadow:has(~ .invert) {
    box-shadow: inset 50px 0 40px -40px #888;
  }
</style>
