<div id="game-board"></div>
<script>
  function appendAnswerText(container, value) {
    const text = String(value);
    const textLength = text.replace(/~/g, "").length;
    const fontSize = Math.max(2.2, 4 - Math.max(0, textLength - 12) * 0.06);

    container.style.display = "flex";
    container.style.alignItems = "center";
    container.style.justifyContent = "center";
    container.style.padding = "1.2cqmin";
    container.style.boxSizing = "border-box";
    container.style.overflow = "hidden";

    const answerText = document.createElement("div");
    answerText.style.width = "100%";
    answerText.style.maxHeight = "100%";
    answerText.style.lineHeight = "1.1";
    answerText.style.wordBreak = "break-word";
    answerText.style.fontSize = fontSize + "cqmin";

    text.split("~").forEach((segment, index, segments) => {
      if (segment) {
        answerText.appendChild(document.createTextNode(segment));
      }

      if (index < segments.length - 1) {
        const tilde = document.createElement("span");
        tilde.textContent = "~";
        tilde.style.display = "inline-block";
        tilde.style.position = "relative";
        tilde.style.top = "0.45em";
        tilde.style.lineHeight = "1";
        answerText.appendChild(tilde);
      }
    });

    container.appendChild(answerText);
  }

  function appendImageText(container, value) {
    const text = String(value);
    const textLength = [...text].length;
    const isLongText = textLength > 8;

    container.style.display = "flex";
    container.style.flex = isLongText ? "1 1 0" : "unset";
    container.style.alignItems = "center";
    container.style.justifyContent = "center";
    container.style.padding = isLongText ? "0.8cqmin" : "0";
    container.style.boxSizing = "border-box";
    container.style.overflow = "hidden";
    container.style.minWidth = "0";

    if (isLongText) {
      container.style.textAlign = "left";
      container.style.lineHeight = "1.1";
      container.style.wordBreak = "break-word";
      container.style.fontSize =
        Math.max(2, 3.4 - Math.max(0, textLength - 8) * 0.08) + "cqmin";
      container.style.whiteSpace = "normal";
    } else {
      container.style.textAlign = "center";
      container.style.fontSize = "3cqw";
    }

    container.textContent = text;
  }

  cards = [
    ...currentGameData.map((item, index) => {
      return { type: "text", value: item.ans, match: index };
    }),
    ...currentGameData.map((item, index) => {
      return {
        type: "image",
        value: item.image,
        text: item.title,
        match: index,
      };
    }),
  ];
  cards.sort(() => Math.random() - 0.5);

  gameBoard = document.getElementById("game-board");
  cards.forEach((card, cardIndex) => {
    cardFront = document.createElement("div");

    cardFront.classList.add("card");
    cardFront.classList.add("flip");

    cardLeft = "calc(50% + " + ((cardIndex % 4) - 2) * 25 + "cqmin)";
    cardTop = "calc(50% + " + (Math.floor(cardIndex / 4) - 1.5) * 30 + "cqmin)";

    cardFront.id = "front-" + cardIndex;
    cardFront.style.left = cardLeft;
    cardFront.style.top = cardTop;

    if (card.type === "image") {
      cardFront.style.display = "flex";
      cardFront.style.flexDirection = "column";
      cardFront.style.padding = [...card.text].length > 8 ? "0.8cqmin" : "0";
      cardFront.style.boxSizing = "border-box";
      cardFront.style.gap = [...card.text].length > 8 ? "0.8cqmin" : "0";

      cardImage = document.createElement("div");
      const isLongImageText = [...card.text].length > 8;

      cardImage.style.backgroundImage = "url(./assets/pair/" + card.value + ")";
      cardImage.style.backgroundSize = "contain";
      cardImage.style.backgroundRepeat = "no-repeat";
      cardImage.style.backgroundPosition = "center";
      cardImage.style.filter =
        "hue-rotate(" +
        -Math.round((gameData[gMode][gTopic].color / totalGameCount) * 360) +
        "deg)";

      cardImage.style.flex = isLongImageText ? "2 1 0" : "1";
      cardImage.style.minWidth = "0";
      cardImage.style.minHeight = "0";

      cardFront.appendChild(cardImage);

      cardText = document.createElement("div");
      appendImageText(cardText, card.text);
      cardText.style.flex = isLongImageText ? "1 1 0" : "unset";
      cardText.style.minHeight = "0";
      cardText.style.width = "100%";
      cardFront.appendChild(cardText);
    } else {
      appendAnswerText(cardFront, card.value);
    }
    gameBoard.appendChild(cardFront);

    cardBack = document.createElement("div");
    cardBack.style.left = cardLeft;
    cardBack.style.top = cardTop;
    cardBack.id = "back-" + cardIndex;

    cardBack.setAttribute("data-match", card.match);

    cardBack.classList.add("card");
    cardBack.classList.add("back");

    gameBoard.appendChild(cardBack);
  });

  selectedCards = [];
  count = 0;
  flipCount = 0;
  cardsToMatch = 2;

  cards = Array.from(document.getElementsByClassName("back"));
  cards.forEach((card) => {
    card.onclick = () => handleClick(card);
  });

  function handleClick(card) {
    if (selectedCards.length < cardsToMatch) {
      flipCount++;
      card.classList.add("flip");
      document
        .getElementById("front-" + card.id.split("-")[1])
        .classList.remove("flip");

      if (
        selectedCards.length < cardsToMatch &&
        !selectedCards.includes(card)
      ) {
        selectedCards.push(card);

        if (selectedCards.length === cardsToMatch) {
          setTimeout(function () {
            checkMatch();
          }, 1500);
        }
      }
    }
  }

  function checkMatch() {
    match = true;
    firstCard = selectedCards[0];

    selectedCards.forEach((card) => {
      if (
        card.getAttribute("data-match") !== firstCard.getAttribute("data-match")
      )
        match = false;
    });

    if (match) {
      selectedCards.forEach((card) => {
        document
          .getElementById("front-" + card.id.split("-")[1])
          .classList.add("matched");
      });
      count += cardsToMatch;
    } else {
      selectedCards.forEach((card) => {
        card.classList.remove("flip");
        document
          .getElementById("front-" + card.id.split("-")[1])
          .classList.add("flip");
        card.classList.add("back");
      });
    }

    selectedCards = [];

    if (count === cards.length) {
      banner = document.createElement("h1");
      marks = 10;
      if (flipCount > cards.length) {
        marks = Math.max(
          10 - Math.ceil((flipCount - cards.length) / cards.length / 2),
          0,
        );
      }

      min = Math.floor((Date.now() - startTime) / 1000 / 60);
      banner.innerHTML =
        "你贏了!" +
        "<br>你的分數是: " +
        marks +
        "<br>你的時間是: " +
        (min == "0" ? "" : min + "分鐘") +
        Math.round(((Date.now() - startTime) / 1000) % 60) +
        "秒";
      banner.id = "banner";

      document.getElementById("game-board").appendChild(banner);
      parent.postMessage({
        type: "pair",
        marks: marks,
      });
    }
  }
  startTime = Date.now();
</script>
