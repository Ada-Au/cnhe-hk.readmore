<script>
  (function () {
    const website = document.getElementById("site");
    const menu1 = website?.children;
    const menu2 = website?.children;

    const image = website?.querySelector("img");
    const container = menu2;

    const setAspectRatio = () => {
      if (!image || !website || !container) return;
      if (
        website.clientWidth / image.naturalWidth >
        website.clientHeight / image.naturalHeight
      ) {
        container.style.height = "100%";
        container.style.width = "unset";
      } else {
        container.style.height = "unset";
        container.style.width = "100%";
      }
    };

    if (image) {
      image.onload = () => {
        if (container)
          container.style.aspectRatio =
            image.naturalWidth / image.naturalHeight;
      };
    }

    const onResize = () => setAspectRatio();
    window.addEventListener("resize", onResize);
    setAspectRatio();

    window.openLink = (pdf) => {
      window.open(
        parent.window.location.toString().split("?") + "?game=pdf&pdf=" + pdf,
        "_self",
      );
    };

    // --- 核心邏輯控制 ---
    let currentMode = 0; // 儲存目前選擇的 Mode (1, 2, 3)
    let currentTopic = 0; // 儲存目前選擇的 Topic (1, 2, 3)

    const gameMenu = document.getElementById("gameMenu");

    // 第一層：選擇 Mode
    window.selectMode = (modeNum) => {
      currentMode = modeNum;

      // 1. 切換 Mode 按鈕的高亮樣式
      for (let i = 1; i <= 3; i++) {
        const modeBtn = document.getElementById("modeBtn" + i);
        if (modeBtn) {
          modeBtn.style.backgroundColor =
            currentMode === i ? "rgba(206, 249, 254, 1)" : "#f0f0f0";
        }
      }

      // 2. 顯示對應 Mode 的 Topic 群組，隱藏其他群組
      for (let i = 1; i <= 3; i++) {
        const topicGroup = document.getElementById("topicsForMode" + i);
        if (topicGroup) {
          topicGroup.style.display = currentMode === i ? "grid" : "none";
        }
      }

      // 3. 重置狀態：隱藏第三層 Game 選單，並清空所有 Topic 按鈕的高亮顏色
      if (gameMenu) gameMenu.style.display = "none";
      const allTopicBtns = document.querySelectorAll(".topicBtn");
      allTopicBtns.forEach((btn) => (btn.style.backgroundColor = "#f0f0f0"));
      currentTopic = 0;
    };

    // 第二層：選擇 Topic
    window.openMenu = (topicNum) => {
      currentTopic = topicNum;

      // 顯示第三層 Game 菜單
      if (gameMenu) gameMenu.style.display = "flex";

      // 僅高亮當前 Mode 下被選中的 Topic 按鈕
      const currentGroup = document.getElementById(
        "topicsForMode" + currentMode,
      );
      if (currentGroup) {
        const btns = currentGroup.querySelectorAll(".topicBtn");
        btns.forEach((btn, index) => {
          btn.style.backgroundColor =
            index + 1 === topicNum ? "rgba(206, 249, 254, 1)" : "#f0f0f0";
        });
      }
    };

    // 第三層：觸發 Game
    window.openGame = (gameType) => {
      if (typeof setGame === "function") {
        // 傳遞格式：game-topic-mode (例如: connect-2-1 代表 Mode 1 的 Topic 2 的連一連)
        setGame(gameType + "-" + currentMode + "-" + currentTopic);
      } else {
        console.error("找不到 setGame 函數，請確認 game.html 是否有定義。");
      }
    };
  })();
</script>

<div id="site">
  <!-- 第一層：3 個 Mode 選擇區 -->
  <div class="menu three-columns" id="modeMenu">
    <div class="selectBtn" onclick="selectMode(1)" id="modeBtn1">
      第一輯：鄉村改革
    </div>
    <div class="selectBtn" onclick="selectMode(2)" id="modeBtn2">
      第二輯：民生改革
    </div>
    <div class="selectBtn" onclick="selectMode(3)" id="modeBtn3">
      第三輯：改革中的未來
    </div>
  </div>

  <!-- 第二層：Topic 選擇區（根據所選 Mode 顯示對應容器） -->
  <div id="topicContainer">
    <!-- Mode 1 的專屬 Topics -->
    <div class="menu three-columns" id="topicsForMode1" style="display: none">
      <div class="selectBtn topicBtn" onclick="openMenu(1)">
        星空下的種子：<br />跨越時空的禾下夢
      </div>
      <div class="selectBtn topicBtn" onclick="openMenu(2)">
        綠色的約定：<br />從趙家河到余村的時空對話
      </div>
      <div class="selectBtn topicBtn" onclick="openMenu(3)">
        田野間的「智慧魔法」：<br />從荒灘到糧倉
      </div>
    </div>

    <!-- Mode 2 的專屬 Topics -->
    <div class="menu three-columns" id="topicsForMode2" style="display: none">
      <div class="selectBtn topicBtn" onclick="openMenu(1)">
        社會改革：<br />文化自信
      </div>
      <div class="selectBtn topicBtn" onclick="openMenu(2)">
        社會改革：<br />素質教育的演變
      </div>
      <div class="selectBtn topicBtn" onclick="openMenu(3)">
        社會改革：<br />經濟與生活
      </div>
    </div>

    <!-- Mode 3 的專屬 Topics -->
    <div class="menu three-columns" id="topicsForMode3" style="display: none">
      <div class="selectBtn topicBtn" onclick="openMenu(1)">
        改革中的未來：<br />航天與能源
      </div>
      <div class="selectBtn topicBtn" onclick="openMenu(2)">
        改革中的未來：<br />可持續發展
      </div>
      <div class="selectBtn topicBtn" onclick="openMenu(3)">
        改革中的未來：<br />中國北斗
      </div>
    </div>
  </div>

  <!-- 第三層：Game 選擇區（預設隱藏，選擇 Topic 後顯示） -->
  <div
    class="menu two-columns"
    id="gameMenu"
    style="display: none; gap: 16px; justify-content: center; margin-top: 16px"
  >
    <div class="selectBtn" onclick="openGame('connect')">連一連</div>
    <div class="selectBtn" onclick="openGame('pair')">對對碰</div>
  </div>
</div>
