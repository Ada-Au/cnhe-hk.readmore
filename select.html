<script>
  const website = document.getElementById("site");
  const image = website.children[0];
  const container = website.children[1];
  console.log(website.children[1]);

  const setAspectRatio = () => {
    if (
      website.clientWidth / image.naturalWidth >
      website.clientHeight / image.naturalHeight
    ) {
      container.style.height = "100%";
      container.style.width = "unset";
    } else {
      container.style.height = "unset";
      container.style.width = "100%";
    }
  };

  container.style.aspectRatio = image.naturalWidth / image.naturalHeight;

  window.addEventListener("resize", () => {
    setAspectRatio();
  });
  setAspectRatio();

  openLink = (pdf) => {
    console.log(parent.window.location);
    window.open(parent.window.location + "?game=pdf&pdf=" + pdf, "_self");
  };
</script>

<div
  style="
    height: 76vh;
    align-content: center;
    margin-block: 12vh;
    width: 100vw;
    position: relative;
  "
  id="site"
>
  <img
    src="./assets/menu.jpg"
    style="height: 100%; width: 100%; object-fit: contain"
  />
  <div
    style="
      position: absolute;

      width: 100%;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    "
  >
    <div

      <div class="chooseGameBtn" onclick="openLink('pdf01')"></div>

      <div class="chooseGameBtn" onclick="openLink('pdf03')"></div>

  </div>
</div>
