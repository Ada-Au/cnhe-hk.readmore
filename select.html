<script>
  (function () {
    // 1. 將變數包在 IIFE 內，完美解決 redeclaration of const website 錯誤
    const website = document.getElementById("site");

    // 安全檢查：確認 HTML 內是否有對應的元素，避免 children 抓錯爆掉
    const menu1 = website?.children[0];
    const menu2 = website?.children[1];

    // 注意：原本的 image 和 container 因為在此 HTML 結構中不存在（只有兩個 menu），
    // 如果你未來會在 #site 內動態新增圖片，請確保抓取邏輯正確。這裡先保留防錯處理：
    const image = website?.querySelector("img");
    const container = menu2;

    const setAspectRatio = () => {
      if (!image || !website || !container) return; // 防錯機制
      if (
        website.clientWidth / image.naturalWidth >
        website.clientHeight / image.naturalHeight
      ) {
        container.style.height = "100%";
        container.style.width = "unset";
      } else {
        container.style.height = "unset";
        container.style.width = "100%";
      }
    };

    if (image) {
      image.onload = () => {
        if (container)
          container.style.aspectRatio =
            image.naturalWidth / image.naturalHeight;
      };
    }

    // 使用具名函數，方便未來清理，避免重複綁定 resize 造成網頁變卡
    const onResize = () => setAspectRatio();
    window.addEventListener("resize", onResize);
    setAspectRatio();

    // 2. 將全域函數掛載到 window 物件上，確保 HTML 的 onclick="openMenu()" 找得到它們
    window.openLink = (pdf) => {
      window.open(
        parent.window.location.toString().split("?")[0] +
          "?game=pdf&pdf=" +
          pdf,
        "_self",
      );
    };

    let currentGame = 0; // 改用 let 更符合現代規範
    const menu = document.getElementById("menu");

    window.openMenu = (topic) => {
      currentGame = topic;
      if (menu) menu.style.display = "flex";

      let btn;
      for (let i = 1; i <= 3; i++) {
        btn = document.getElementById("btn" + i);
        if (btn) {
          btn.style.backgroundColor =
            currentGame === i ? "rgba(206, 249, 254, 1)" : "#f0f0f0";
        }
      }
    };

    window.openGame = (game) => {
      // 這裡會直接調用父層 game.html 已經定義好的 setGame 函數
      if (typeof setGame === "function") {
        setGame(game + "-" + currentGame);
      } else {
        console.error("找不到 setGame 函數，請確認 game.html 是否有定義。");
      }
    };
  })();
</script>

<div id="site">
  <div class="menu">
    <div class="selectBtn" onclick="openMenu(1)" id="btn1">
      星空下的種子：<br />跨越時空的禾下夢
    </div>
    <div class="selectBtn" onclick="openMenu(2)" id="btn2">
      綠色的約定：<br />從趙家河到余村的時空對話
    </div>
    <div class="selectBtn" onclick="openMenu(3)" id="btn3">
      田野間的「智慧魔法」：<br />從荒灘到糧倉
    </div>
  </div>

  <div
    class="menu"
    id="menu"
    style="display: none; gap: 16px; justify-content: center; margin-top: 16px"
  >
    <div class="selectBtn" onclick="openGame('connect')">連一連</div>
    <div class="selectBtn" onclick="openGame('pair')">對對碰</div>
  </div>
</div>
